{% extends "base.html" %}

{% block title %}Add Activity | CarbonX{% endblock %}

{% block content %}

<div class="page-header">
    <h1>Record Activity</h1>
    <p>Record an emission-generating activity for an establishment.</p>
</div>

<div class="form-card">

    <form method="POST">

        <div class="form-section">

            <h2>Activity Details</h2>

            <div class="form-group">

                <label for="est_id">Establishment</label>

                <select id="est_id" name="est_id" required>

                    <option value="" disabled selected>
                        Select an establishment
                    </option>

                    {% for e in establishments %}
                    <option value="{{ e.est_id }}">
                        {{ e.est_name }}
                    </option>
                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label for="source_id">Emission Source</label>

                <select id="source_id" name="source_id" required>

                    <option value="" disabled selected>
                        Select emission source
                    </option>

                    {% for s in sources %}
                    <option value="{{ s.source_id }}">
                        {{ s.source_name }}
                    </option>
                    {% endfor %}

                </select>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="quantity">Quantity</label>

                    <input
                        type="number"
                        id="quantity"
                        name="quantity"
                        placeholder="Enter quantity"
                        min="0"
                        step="0.01"
                        required>

                </div>


                <div class="form-group">

                    <label for="period">Period</label>

                    <input
                        type="text"
                        id="period"
                        name="period"
                        placeholder="e.g. 2025"
                        required>

                </div>

            </div>

        </div>


        <div class="form-actions">

            <a href="/" class="secondary-button">
                Cancel
            </a>

            <button type="submit">
                Record Activity
            </button>

        </div>

    </form>

</div>

{% endblock %}
